<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Ranking Game</title>
    <link rel="stylesheet" href="style_new.css">
    <!-- Add Google API Client Library -->
    <script src="https://apis.google.com/js/api.js"></script>
</head>
<body>
    <div class="container">
        <h1>Vote for the Best Photo!</h1>-
        
        <div class="photos-container">
            <div class="photo-card">
                <div id="photo-1-container" class="photo-container">
                    <div class="photo-circle">
                        <img id="photo-1-img" src="" alt="Photo 1" class="photo">
                    </div>
                </div>
            </div>

            <div class="photo-card">
                <div id="photo-2-container" class="photo-container">
                    <div class="photo-circle">
                        <img id="photo-2-img" src="" alt="Photo 2" class="photo">
                    </div>
                </div>
            </div>
        </div>

        <div class="game-controls">
            <p>Round: <span id="round-number">0</span></p>
            <button id="show-leaderboard-btn">Show Leaderboard</button>
        </div>

        <div id="leaderboard-container" style="display: none;">
            <h2>Leaderboard</h2>
            <ul id="leaderboard-list"></ul>
        </div>
    </div>

    <script src="script_new.js"></script>
</body>
</html>
